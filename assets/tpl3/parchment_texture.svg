<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1200" width="850" height="1200">
  <defs>
    <!-- Paper base grain filter -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.94
        0 0 0 0 0.91
        0 0 0 0 0.83
        0 0 0 0.22 0" in="noise" result="coloredNoise" />
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
    </filter>

    <!-- Edge tea stain vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#fffcf7" stop-opacity="0" />
      <stop offset="85%" stop-color="#e2caa6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c8a576" stop-opacity="0.65" />
    </radialGradient>

    <!-- Classical watermark crest in center -->
    <linearGradient id="watermarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b08d57" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#8c6208" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Parchment Base -->
  <rect width="100%" height="100%" fill="#faf6ee" />
  
  <!-- Grain overlay -->
  <rect width="100%" height="100%" fill="#faf6ee" filter="url(#paperGrain)" />
  
  <!-- Subtle center watermark seal -->
  <g transform="translate(425, 600) scale(1.6)" opacity="0.06">
    <circle r="120" fill="none" stroke="#8c6208" stroke-width="4" stroke-dasharray="6,3" />
    <circle r="105" fill="none" stroke="#8c6208" stroke-width="2" />
    <polygon points="0,-60 17,-15 62,-15 25,12 39,57 0,30 -39,57 -25,12 -62,-15 -17,-15" fill="#8c6208" />
    <text y="80" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" letter-spacing="6" fill="#8c6208">OFFICIAL REGISTRY ARCHIVES</text>
  </g>

  <!-- Aged Vignette on margins -->
  <rect width="100%" height="100%" fill="url(#vignette)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" width="340" height="140">
  <defs>
    <!-- Rich 24K Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc" />
      <stop offset="25%" stop-color="#e5c158" />
      <stop offset="50%" stop-color="#c29424" />
      <stop offset="75%" stop-color="#f3d878" />
      <stop offset="100%" stop-color="#8c6208" />
    </linearGradient>

    <!-- Deep Metallic Shadow Gradient -->
    <linearGradient id="darkGoldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5a3f05" />
      <stop offset="50%" stop-color="#8e6712" />
      <stop offset="100%" stop-color="#dfba4f" />
    </linearGradient>

    <!-- Crystal Diamond Highlight -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f7e7a8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Luxury Filter Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Left Baroque Acanthus Wing -->
    <g transform="translate(170, 70) scale(-1, 1) translate(-170, -70)">
      <!-- Right Wing details copied via mirror -->
    </g>

    <!-- Central Decorative Crest Shield Outline -->
    <path d="M 170 18 Q 230 18 260 45 Q 275 75 250 105 Q 210 125 170 135 Q 130 125 90 105 Q 65 75 80 45 Q 110 18 170 18 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    
    <path d="M 170 24 Q 225 24 252 48 Q 265 74 242 100 Q 205 119 170 128 Q 135 119 98 100 Q 75 74 88 48 Q 115 24 170 24 Z"
          fill="#0c0612" stroke="url(#darkGoldGrad)" stroke-width="1.5" />

    <!-- Left Floral Wing / Flourish -->
    <path d="M 85 45 C 50 35, 20 50, 10 75 C 25 80, 45 70, 58 60 C 40 75, 25 95, 30 115 C 45 105, 65 92, 75 80 C 65 95, 60 112, 70 125 C 80 115, 90 98, 92 85"
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 65 52 Q 40 58 28 72 Q 45 74 58 62" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 55 78 Q 38 90 38 105 Q 52 96 68 82" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Right Floral Wing / Flourish -->
    <path d="M 255 45 C 290 35, 320 50, 330 75 C 315 80, 295 70, 282 60 C 300 75, 315 95, 310 115 C 295 105, 275 92, 265 80 C 275 95, 280 112, 270 125 C 260 115, 250 98, 248 85"
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 275 52 Q 300 58 312 72 Q 295 74 282 62" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 285 78 Q 302 90 302 105 Q 288 96 272 82" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Royal Queen Crown atop Spade -->
    <g transform="translate(170, 32)">
      <path d="M -28 6 L -35 -10 L -16 -3 L 0 -15 L 16 -3 L 35 -10 L 28 6 Z"
            fill="url(#goldGrad)" stroke="#4a3505" stroke-width="1.2" />
      <!-- Crown jewels / Pearls -->
      <circle cx="-35" cy="-10" r="2.5" fill="#ffffff" stroke="#c29424" stroke-width="0.8" />
      <circle cx="-16" cy="-3" r="2" fill="#ffffff" stroke="#c29424" stroke-width="0.8" />
      <circle cx="0" cy="-15" r="3.2" fill="#ffffff" stroke="#c29424" stroke-width="0.8" />
      <circle cx="16" cy="-3" r="2" fill="#ffffff" stroke="#c29424" stroke-width="0.8" />
      <circle cx="35" cy="-10" r="2.5" fill="#ffffff" stroke="#c29424" stroke-width="0.8" />
      <!-- Crown base band -->
      <rect x="-26" y="4" width="52" height="4" rx="1.5" fill="url(#darkGoldGrad)" stroke="#ffeaa7" stroke-width="0.6" />
    </g>

    <!-- Main Spade (♠) Insignia with 3D Bevel -->
    <g transform="translate(170, 72)">
      <!-- Shadow base -->
      <path d="M 0 -36 C -2 -36, -38 -8, -38 14 C -38 29, -24 38, -9 35 C -1 33, 0 25, 0 25 C 0 25, 1 33, 9 35 C 24 38, 38 29, 38 14 C 38 -8, 2 -36, 0 -36 Z"
            fill="#000000" />
      
      <!-- Left faceted half (Bright Gold) -->
      <path d="M 0 -36 C -1 -36, -38 -8, -38 14 C -38 29, -24 38, -9 35 C -1 33, 0 25, 0 25 Z"
            fill="url(#goldGrad)" stroke="#ffeaa7" stroke-width="0.8" />
      
      <!-- Right faceted half (Deep Gold with Sheen) -->
      <path d="M 0 -36 C 1 -36, 38 -8, 38 14 C 38 29, 24 38, 9 35 C 1 33, 0 25, 0 25 Z"
            fill="url(#darkGoldGrad)" stroke="#ffeaa7" stroke-width="0.8" />

      <!-- Spade Stem -->
      <path d="M -5 22 Q -16 42 -22 45 L 22 45 Q 16 42 5 22 Z"
            fill="url(#goldGrad)" stroke="#5a3f05" stroke-width="0.8" />

      <!-- Elegant 'Q' Monogram inside Spade -->
      <text x="0" y="16" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="32" font-weight="900" font-style="italic"
            fill="#ffffff" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.9))" letter-spacing="-1">Q</text>
    </g>

    <!-- Bottom Ribbon Banner: QUEEN OF SPADES -->
    <g transform="translate(170, 126)">
      <path d="M -85 -6 L -75 6 L 75 6 L 85 -6 Q 0 0 -85 -6 Z" fill="url(#darkGoldGrad)" stroke="url(#goldGrad)" stroke-width="1.2" />
      <text x="0" y="2" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-size="9" font-weight="900" letter-spacing="2.8"
            fill="#fff4d0" filter="drop-shadow(0 1px 1px #000)">QUEEN OF SPADES</text>
    </g>
  </g>
</svg>